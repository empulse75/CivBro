[package]
name = "civbro_core"
version = "1.0.0"
edition = "2021"
# Proprietary, use-only licence (see repository LICENSE) — never publish to crates.io.
license-file = "LICENSE"
publish = false

[lib]
name = "civbro_core"
# rlib is required for `cargo test`; cdylib is what Python loads.
crate-type = ["cdylib", "rlib"]

[features]
# Enable only for extension builds: Rust tests must link libpython normally.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310"] }
rusqlite = { version = "0.32", features = ["bundled", "vtab"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
blake3 = "1.5"
walkdir = "2.5"
regex = "1.11"
base64 = "0.22"
ed25519-dalek = "2.1"

# Portable release profile — the .so ships to users on arbitrary hardware.
# LTO/opt-level/codegen-units in [profile.release] are portable-safe.
# DO NOT use RUSTFLAGS="-C target-cpu=native" — bakes host CPU features into
# the binary (SIGILL on other CPUs). sha2/blake3 select SIMD at runtime already.
[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
