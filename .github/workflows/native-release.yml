name: Portable native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            manylinux: '2014'
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2014'
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            manylinux: 'off'
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            manylinux: 'off'
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: 'off'
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: 'off'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Build optimized portable abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v1.11.5
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          working-directory: core_rust
          args: --release --locked --interpreter python3.13 --out ../wheelhouse
      - name: Exercise real wheel on native OS
        run: python .github/scripts/check_native.py wheelhouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: wheels
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: wheel-*
          path: wheelhouse
          merge-multiple: true
      - name: Generate release integrity metadata
        run: python .github/scripts/release_checksums.py wheelhouse
      - name: Publish only after all six native checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "CivBro $RELEASE_TAG" --notes "Use-only licensed CivBro with portable native wheels for Linux, Windows and macOS (x86-64 and ARM64). CPython 3.10+ with the GIL; A1111-compatible WebUI extension API required. See README and LICENSE for prerequisites and terms."
          gh release upload "$RELEASE_TAG" wheelhouse/*
          gh release edit "$RELEASE_TAG" --draft=false
